# DKMS: rebuilds the driver for every new kernel. Install with
# scripts/dkms-install.sh (it fills in PACKAGE_VERSION from creative_ae9.h).
PACKAGE_NAME="snd-hda-codec-creative-ae9"
PACKAGE_VERSION="0.9.0"
BUILT_MODULE_NAME[0]="snd-hda-codec-creative-ae9"
DEST_MODULE_LOCATION[0]="/extra"
MAKE[0]="make KDIR=/lib/modules/${kernelver}/build"
AUTOINSTALL="yes"
