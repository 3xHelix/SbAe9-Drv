#   hu_fast_ms=40 hu_cmd_settle_us=4000   head-unit knob timing
#   pcm_rates=1                      playback also at 96, 192 and 384 kHz
#   pcm_bits=32                      send all 32 sample bits (default 24)
#options snd-hda-codec-creative-ae9 fw_verify=1
#options snd-hda-codec-creative-ae9 pcm_rates=1
