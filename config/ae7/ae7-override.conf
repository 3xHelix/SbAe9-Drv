# Sound Blaster AE-7 (experimental, opt-in): shipped inactive in
# /usr/share/creative-ae9/ae7/; "sudo ae9-ae7-enable" copies it to
# /etc/modprobe.d/ with 00-ae7-override.rules, "--disable" removes both.
#
# ae7=1: the driver runs an AE-7 it is handed (without it, it refuses the
# card with one log line and leaves it alone).
options snd-hda-codec-creative-ae9 ae7=1
# Fallback for 00-ae7-override.rules, as ae9-override.conf is for the AE-9:
# if snd_hda_intel loads before udev has handed the card over, mark the card
# for our driver first. modprobe runs only the first "install" line it reads
# for a module, and this file is read before ae9-override.conf, so it also
# marks an AE-9 (subsystem 0x0071), as that file would. Finds the cards by
# their IDs, so it works in any slot.
install snd_hda_intel for d in /sys/bus/pci/devices/*; do [ "$(cat $d/vendor)" = 0x1102 ] && [ "$(cat $d/device)" = 0x0010 ] && case "$(cat $d/subsystem_device)" in 0x0071|0x0081) echo snd-hda-codec-creative-ae9 > $d/driver_override ;; esac; done 2>/dev/null; exec /sbin/modprobe --ignore-install snd_hda_intel $CMDLINE_OPTS
