# Optional: PipeWire headroom for the AE-9 at small quantums. Not needed
# with PipeWire's defaults. 256 suits 384 kHz and covers every rate; for
# the rate you use most: 48 kHz 64, 96 kHz 96, 192 kHz 144 (at 48 kHz, 256
# adds ~5 ms). See the README, "Low latency".
#   cp config/60-ae9-headroom.conf ~/.config/wireplumber/wireplumber.conf.d/
#   systemctl --user restart wireplumber
monitor.alsa.rules = [
  {
    matches = [ { alsa.driver_name = "snd_hda_codec_creative_ae9", media.class = "Audio/Sink" } ]
    actions = { update-props = { api.alsa.headroom = 256 } }
  }
]
