# Optional: a clearer desktop name for the AE-9's main recording input
# (and the AE-7's inputs and output: experimental, opt-in).
# The head unit's XLR/TRS jack and its 3.5 mm mic jack share one input
# (Windows lists them as Microphone and Aux), so the source is named for
# both. Install as
#   ~/.config/wireplumber/wireplumber.conf.d/61-ae9-names.conf
# then: systemctl --user restart wireplumber
# Only the description changes; node names (what apps and SbAe9-SBC use to
# find the device) stay the same. The profile set (creative-ae9.conf) also
# opens Optical In, What U Hear (stereo, or 5.1 in the 5.1 profile) and
# the head unit's rear RCA input as sources, and Optical Out as a sink;
# they get their short names here too, and the main output (stereo or
# 5.1) shows as "AE-9 Analog Out" next to "AE-9 Optical Out".
# Each rule matches one card by its name, so a Sound Blaster AE-7 on this
# driver gets its own names: "AE-7 Mic-in" (the card's Line-in / Mic-in
# jack), "AE-7 What U Hear" and "AE-7 Analog Out".
monitor.alsa.rules = [
  {
    matches = [ {
      alsa.driver_name = "snd_hda_codec_creative_ae9"
      alsa.card_name = "Sound Blaster AE-9"
      media.class = "Audio/Source"
      node.name = "~alsa_input.pci-.*[.]analog-stereo"
    } ]
    actions = { update-props = {
      node.description = "AE-9 Head Unit Mic / Aux"
      node.nick = "AE-9 Head Unit Mic / Aux"
    } }
  }
  {
    matches = [ {
      alsa.driver_name = "snd_hda_codec_creative_ae9"
      alsa.card_name = "Sound Blaster AE-9"
      media.class = "Audio/Source"
      node.name = "~alsa_input.pci-.*[.]rear_rca"
    } ]
    actions = { update-props = {
      node.description = "AE-9 Rear RCA In"
      node.nick = "AE-9 Rear RCA In"
    } }
  }
  {
    matches = [ {
      alsa.driver_name = "snd_hda_codec_creative_ae9"
      alsa.card_name = "Sound Blaster AE-9"
      media.class = "Audio/Source"
      node.name = "~alsa_input.pci-.*[.]what_u_hear(_51)?"
    } ]
    actions = { update-props = {
      node.description = "AE-9 What U Hear"
      node.nick = "AE-9 What U Hear"
    } }
  }
  {
    matches = [ {
      alsa.driver_name = "snd_hda_codec_creative_ae9"
      alsa.card_name = "Sound Blaster AE-9"
      media.class = "Audio/Source"
      node.name = "~alsa_input.pci-.*[.]optical_in"
    } ]
    actions = { update-props = {
      node.description = "AE-9 Optical In"
      node.nick = "AE-9 Optical In"
    } }
  }
  {
    matches = [ {
      alsa.driver_name = "snd_hda_codec_creative_ae9"
      alsa.card_name = "Sound Blaster AE-9"
      media.class = "Audio/Sink"
      node.name = "~alsa_output.pci-.*[.]optical_out"
    } ]
    actions = { update-props = {
      node.description = "AE-9 Optical Out"
      node.nick = "AE-9 Optical Out"
    } }
  }
  {
    matches = [ {
      alsa.driver_name = "snd_hda_codec_creative_ae9"
      alsa.card_name = "Sound Blaster AE-9"
      media.class = "Audio/Sink"
      node.name = "~alsa_output.pci-.*[.]analog-(stereo|surround-51)"
    } ]
    actions = { update-props = {
      node.description = "AE-9 Analog Out"
      node.nick = "AE-9 Analog Out"
    } }
  }
  {
    matches = [ {
      alsa.driver_name = "snd_hda_codec_creative_ae9"
      alsa.card_name = "Sound Blaster AE-7"
      media.class = "Audio/Source"
      node.name = "~alsa_input.pci-.*[.]analog-stereo"
    } ]
    actions = { update-props = {
      node.description = "AE-7 Mic-in"
      node.nick = "AE-7 Mic-in"
    } }
  }
  {
    matches = [ {
      alsa.driver_name = "snd_hda_codec_creative_ae9"
      alsa.card_name = "Sound Blaster AE-7"
      media.class = "Audio/Source"
      node.name = "~alsa_input.pci-.*[.]what_u_hear"
    } ]
    actions = { update-props = {
      node.description = "AE-7 What U Hear"
      node.nick = "AE-7 What U Hear"
    } }
  }
  {
    matches = [ {
      alsa.driver_name = "snd_hda_codec_creative_ae9"
      alsa.card_name = "Sound Blaster AE-7"
      media.class = "Audio/Sink"
      node.name = "~alsa_output.pci-.*[.]analog-(stereo|surround-51)"
    } ]
    actions = { update-props = {
      node.description = "AE-7 Analog Out"
      node.nick = "AE-7 Analog Out"
    } }
  }
]
