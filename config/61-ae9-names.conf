# Optional: a clearer desktop name for the AE-9's main recording input.
# The head unit's XLR/TRS jack and its 3.5 mm mic jack share one input
# (Windows lists them as Microphone and Aux), so the source is named for
# both. Install as
#   ~/.config/wireplumber/wireplumber.conf.d/61-ae9-names.conf
# then: systemctl --user restart wireplumber
# Only the description changes; node names (what apps and SbAe9-SBC use to
# find the device) stay the same. The optical and What U Hear sources
# have their own names already.
monitor.alsa.rules = [
  {
    matches = [ {
      alsa.driver_name = "snd_hda_codec_creative_ae9"
      media.class = "Audio/Source"
      node.name = "~alsa_input.pci-.*"
    } ]
    actions = { update-props = {
      node.description = "AE-9 Head Unit Mic / Aux"
      node.nick = "AE-9 Head Unit Mic / Aux"
    } }
  }
]
