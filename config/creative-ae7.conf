# PipeWire / PulseAudio profile set for the Creative Sound Blaster AE-7 under
# snd-hda-codec-creative-ae9 (experimental, opt-in: ae9-ae7-enable). Install
# as
#   /usr/share/alsa-card-profile/mixer/profile-sets/creative-ae7.conf
# and attach it with config/89-ae7-pipewire.rules (ACP_PROFILE_SET).
#
# The driver's devices on the AE-7:
#   hw:%f,0  playback: stereo (DSP mode at 48 kHz; Direct Mode at 44.1/48/
#            88.2/96/192/384 kHz), or 6 channels (FL FR FC LFE RL RR) in DSP
#            mode at 48 kHz (a change between 2 and 6 rebuilds the DSP path,
#            muted); recording: the card's Line-in / Mic-in jack (the Audio
#            Control Module's mic lead), 44.1/48/96 kHz
#   hw:%f,2  What U Hear (what the card plays), 44.1/48 kHz
# Both outputs use the driver's Master Playback Volume / Switch as the
# hardware volume (paths-output = analog-output) and the mic its Capture
# Volume (paths-input = analog-input), as the AE-9's profile set. No
# skip-probe: without the probe PipeWire sets up no port and no hardware
# volume.
#
# Each duplex profile has a "mic only" twin without What U Hear, ranked just
# below it (above the output-only ones): if that device can't be opened,
# PipeWire falls back to the twin and keeps the mic and the playback.
# The AE-7 has no optical in/out, rear RCA input or head unit in this driver
# yet. Mapping and profile names are the AE-9 profile set's (the same node
# names, alsa_output.pci-...analog-stereo and so on).

[General]
auto-profiles = no

[Mapping analog-stereo]
device-strings = hw:%f,0
channel-map = left,right
paths-output = analog-output
paths-input = analog-input
priority = 15

[Mapping analog-surround-51]
device-strings = hw:%f,0
channel-map = front-left,front-right,front-center,lfe,rear-left,rear-right
paths-output = analog-output
priority = 7
direction = output

[Mapping what_u_hear]
description = What U Hear
device-strings = hw:%f,2
channel-map = left,right
priority = 2
direction = input

[Profile output:analog-stereo+input:analog-stereo]
description = Analog Stereo Duplex
output-mappings = analog-stereo
input-mappings = analog-stereo what_u_hear
priority = 6565

[Profile basic:output:analog-stereo+input:analog-stereo]
description = Analog Stereo Duplex (mic only)
output-mappings = analog-stereo
input-mappings = analog-stereo
priority = 6560

[Profile output:analog-surround-51+input:analog-stereo]
description = Analog Surround 5.1 Output + Analog Stereo Input
output-mappings = analog-surround-51
input-mappings = analog-stereo what_u_hear
priority = 1365

[Profile basic:output:analog-surround-51+input:analog-stereo]
description = Analog Surround 5.1 Output + Analog Stereo Input (mic only)
output-mappings = analog-surround-51
input-mappings = analog-stereo
priority = 1360

[Profile output:analog-stereo]
description = Analog Stereo Output
output-mappings = analog-stereo
priority = 6500

[Profile output:analog-surround-51]
description = Analog Surround 5.1 Output
output-mappings = analog-surround-51
priority = 1300
