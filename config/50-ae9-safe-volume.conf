# Installed by the packages (WirePlumber's system conf.d): a safe start
# volume for the AE-9's outputs.
#
# With the card's hardware volume, PipeWire's output volume IS the head
# unit's volume: 100% = 0.0 dB, the DAC wide open. The driver starts the
# head unit at -36.0 dB (Windows' boot volume), but WirePlumber then sets
# the volume it saved for the output, or, for an output it has none for,
# its own default (-24 dB). This makes that default -36 dB for the AE-9,
# the same as the driver. Volumes you set are still saved and restored as
# usual; this only applies when WirePlumber has nothing saved.
#
# Volumes here are linear: -36 dB = 10^(-36/20) = 0.0158.
monitor.alsa.rules = [
  {
    # alsa.driver_name isn't set yet when these rules run (tested:
    # no match); the card name our driver sets is
    matches = [ {
      device.name = "~alsa_card.*"
      api.alsa.card.name = "Sound Blaster AE-9"
    } ]
    actions = { update-props = {
      device.routes.default-sink-volume = 0.0158
    } }
  }
]
