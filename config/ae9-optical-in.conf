# DRIVER 0.10.x ONLY. Since 0.11.0 the card's profile set (creative-ae9.conf,
# installed by the packages) opens optical in itself: don't install this
# with it (the device can only be opened once; the source shows up twice
# or fails). Delete it from ~/.config/pipewire/pipewire.conf.d/ if you
# copied it there.
#
# Optional: the AE-9's optical (S/PDIF) input as a PipeWire source,
# "AE-9 Optical In", next to the head unit's XLR mic. Install as
#   ~/.config/pipewire/pipewire.conf.d/ae9-optical-in.conf
# then: systemctl --user restart pipewire
#
# The optical input is the driver's second PCM device (hw:AE9,1).
# S/PDIF input can't resample: the sender's rate and PipeWire's rate must
# match (48 kHz by default; set clock.force-rate or audio.rate below to
# record a 44.1/96/192 kHz source). With nothing sending, recording from
# it fails at once ("no signal on the optical input" in the kernel log).
context.objects = [
    { factory = adapter
        args = {
            factory.name     = api.alsa.pcm.source
            node.name        = "alsa_input.ae9_optical"
            node.description = "AE-9 Optical In"
            node.nick        = "AE-9 Optical"
            media.class      = "Audio/Source"
            api.alsa.path    = "hw:AE9,1"
            audio.format     = "S32LE"
            audio.channels   = 2
            audio.position   = [ FL FR ]
            # below the XLR mic, so it never becomes the default input
            priority.session = 100
            priority.driver  = 100
            node.suspend-on-idle = true
        }
        flags = [ nofail ]
    }
]
