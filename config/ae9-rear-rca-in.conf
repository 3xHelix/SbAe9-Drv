# DRIVER 0.10.x ONLY. Since 0.11.0 the card's profile set (creative-ae9.conf,
# installed by the packages) opens rear RCA in itself: don't install this
# with it (the device can only be opened once; the source shows up twice
# or fails). Delete it from ~/.config/pipewire/pipewire.conf.d/ if you
# copied it there.
#
# Optional: the head unit's rear RCA L/R input as a PipeWire source,
# "AE-9 Rear RCA In" (a turntable preamp, mixer, console, phone...). Install
# as ~/.config/pipewire/pipewire.conf.d/ae9-rear-rca-in.conf
# then: systemctl --user restart pipewire
#
# The rear RCA input is the driver's fourth PCM device (hw:AE9,3).
# 24-bit, 44.1 to 192 kHz; it records alongside the XLR mic.
context.objects = [
    { factory = adapter
        args = {
            factory.name     = api.alsa.pcm.source
            node.name        = "alsa_input.ae9_rear_rca"
            node.description = "AE-9 Rear RCA In"
            node.nick        = "AE-9 Rear RCA"
            media.class      = "Audio/Source"
            api.alsa.path    = "hw:AE9,3"
            audio.format     = "S32LE"
            audio.channels   = 2
            audio.position   = [ FL FR ]
            # below the XLR mic, so it never becomes the default input
            priority.session = 100
            priority.driver  = 100
            node.suspend-on-idle = true
        }
        flags = [ nofail ]
    }
]
