#
# AE-9 "clean mic" (optional example, off unless you install it): adds an input
# "AE-9 Mic (clean)" = the AE-9 mic through PipeWire's WebRTC engine with noise
# suppression and an 80 Hz-ish high-pass (hum, hiss, rumble), no automatic gain.
# Close to what Windows does to the mic: Windows' cleaner mic is Microsoft's
# "Voice Clarity" effect pack (software noise suppression), not the card.
# The plain "AE-9 Mic / Line In" input stays untouched for recording.
#
# Don't combine it with the card's own Voice Clarity (the DSP one): two noise
# suppressors fight. Use one or the other.
#
# Needs: PipeWire 1.0 or newer (module-echo-cancel + the WebRTC library ship
# with PipeWire on Fedora, Arch, Debian/Ubuntu). Mono: the AE-9 mic is mono
# (left = right). 48 kHz.
#
# Your AE-9 mic's name: the target.object below has the card's PCI slot in it
# (pci-0000_06_00.0 here). Find yours with
#   pactl list short sources | grep 'pci-.*analog-stereo$'
# and put it in place of the one below.
# Install: copy to ~/.config/pipewire/pipewire.conf.d/ and run
#   systemctl --user restart pipewire pipewire-pulse wireplumber
# then pick "AE-9 Mic (clean)" as the microphone in your app.
# Remove: delete the file and restart the same way.
context.modules = [
    {   name = libpipewire-module-echo-cancel
        args = {
            library.name = aec/libspa-aec-webrtc
            # the echo reference is the default output's monitor: it can also
            # take out some of the headphone sound that leaks into the mic
            monitor.mode = true
            audio.channels = 1
            audio.position = [ MONO ]
            aec.args = {
                webrtc.noise_suppression = true
                webrtc.high_pass_filter = true
                webrtc.gain_control = false
            }
            capture.props = {
                node.name = "ae9_mic_clean_capture"
                target.object = "alsa_input.pci-0000_06_00.0.analog-stereo"
                # don't hold the mic open while nothing records from "clean"
                node.passive = true
            }
            source.props = {
                node.name = "ae9_mic_clean"
                node.description = "AE-9 Mic (clean)"
            }
        }
    }
]
