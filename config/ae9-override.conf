# Fallback for 00-ae9-override.rules: if snd_hda_intel loads before udev has
# handed the card over, mark every AE-9 (PCI 1102:0010, subsystem 0x0071) for
# our driver first. Finds the card by its IDs, so it works in any slot.
install snd_hda_intel for d in /sys/bus/pci/devices/*; do [ "$(cat $d/vendor)" = 0x1102 ] && [ "$(cat $d/device)" = 0x0010 ] && [ "$(cat $d/subsystem_device)" = 0x0071 ] && echo snd-hda-codec-creative-ae9 > $d/driver_override; done 2>/dev/null; exec /sbin/modprobe --ignore-install snd_hda_intel $CMDLINE_OPTS
