# PipeWire / PulseAudio profile set for the Creative Sound Blaster AE-9
# (snd-hda-codec-creative-ae9). Install as
#   /usr/share/alsa-card-profile/mixer/profile-sets/creative-ae9.conf
# and attach it with config/89-ae9-pipewire.rules (ACP_PROFILE_SET).
#
# The driver has one playback PCM: stereo, or 6 channels with surround=1,
# in Windows' 5.1 order FL FR FC LFE RL RR (front RCA jacks, Center/Sub
# jack, Rear jack). Without this file PipeWire only offers its stereo
# fallback profiles.
#
# Besides the head unit mic (hw:%f,0), the profiles open three more
# recording devices as their own sources, so nothing has to be copied by
# hand:
#   hw:%f,1  Optical In (S/PDIF; records silence while no signal comes in,
#            driver 0.11.0+; no resampling: the sender's rate must match)
#   hw:%f,2  What U Hear (what the card plays)
#   hw:%f,3  Head unit rear RCA In
# and a second output:
#   hw:%f,4  Optical Out (S/PDIF, driver 0.12+): its own stream. With
#            "Optical Out Mirror Switch" on (off by default since 0.12.1),
#            the optical jack mirrors the main output while nothing plays
#            to it.
#
# Each duplex profile has a "basic" twin without the extra inputs, ranked
# just below it (above the output-only profiles): if one of those devices
# can't be opened, PipeWire falls back to the twin and keeps the mic.
#
# Profile and mapping names of the stereo/5.1 outputs and the mic are the
# same as before, so the main sink and source keep their node names.

[General]
auto-profiles = no

[Mapping analog-stereo]
device-strings = hw:%f,0
channel-map = left,right
paths-output = analog-output
paths-input = analog-input
priority = 15

[Mapping analog-surround-51]
device-strings = hw:%f,0
channel-map = front-left,front-right,front-center,lfe,rear-left,rear-right
paths-output = analog-output
priority = 7
direction = output

[Mapping optical_out]
description = Optical Out
device-strings = hw:%f,4
channel-map = left,right
priority = 1
direction = output

[Mapping optical_in]
description = Optical In
device-strings = hw:%f,1
channel-map = left,right
priority = 1
direction = input

[Mapping what_u_hear]
description = What U Hear
device-strings = hw:%f,2
channel-map = left,right
priority = 2
direction = input

# The same loopback with the card's 5.1 mix (FL FR FC LFE RL RR, tested
# level-exact per channel 2026-11-08), for a software AC-3 encoder. Only the
# 5.1 duplex profile uses it: in stereo, channels 3-6 carry only the DSP's
# surround upmix, and a stereo recorder would get them downmixed in.
[Mapping what_u_hear_51]
description = What U Hear 5.1
device-strings = hw:%f,2
channel-map = front-left,front-right,front-center,lfe,rear-left,rear-right
priority = 2
direction = input

[Mapping rear_rca]
description = Rear RCA In
device-strings = hw:%f,3
channel-map = left,right
priority = 3
direction = input

[Profile output:analog-stereo+input:analog-stereo]
description = Analog Stereo Duplex
output-mappings = analog-stereo optical_out
input-mappings = analog-stereo rear_rca what_u_hear optical_in
priority = 6565

[Profile output:analog-surround-51+input:analog-stereo]
description = Analog Surround 5.1 Output + Analog Stereo Input
output-mappings = analog-surround-51 optical_out
input-mappings = analog-stereo rear_rca what_u_hear_51 optical_in
priority = 765

[Profile output:analog-stereo]
description = Analog Stereo Output
output-mappings = analog-stereo optical_out
priority = 6500

[Profile output:analog-surround-51]
description = Analog Surround 5.1 Output
output-mappings = analog-surround-51 optical_out
priority = 700

[Profile input:analog-stereo]
description = Analog Stereo Input
input-mappings = analog-stereo rear_rca what_u_hear optical_in
priority = 65

[Profile basic:output:analog-stereo+input:analog-stereo]
description = Analog Stereo Duplex (mic only)
output-mappings = analog-stereo
input-mappings = analog-stereo
priority = 6560

[Profile basic:output:analog-surround-51+input:analog-stereo]
description = Analog Surround 5.1 Output + Analog Stereo Input (mic only)
output-mappings = analog-surround-51
input-mappings = analog-stereo
priority = 760
