# PipeWire / PulseAudio profile set for the Creative Sound Blaster AE-9
# (snd-hda-codec-creative-ae9). Install as
#   /usr/share/alsa-card-profile/mixer/profile-sets/creative-ae9.conf
# and attach it with config/89-ae9-pipewire.rules (ACP_PROFILE_SET).
#
# The driver has one playback PCM: stereo, or 6 channels with surround=1,
# in Windows' 5.1 order FL FR FC LFE RL RR (front RCA jacks, Center/Sub
# jack, Rear jack). Without this file PipeWire only offers its stereo
# fallback profiles.

[General]
auto-profiles = yes

[Mapping analog-stereo]
device-strings = hw:%f,0
channel-map = left,right
paths-output = analog-output
paths-input = analog-input
priority = 15

[Mapping analog-surround-51]
device-strings = hw:%f,0
channel-map = front-left,front-right,front-center,lfe,rear-left,rear-right
paths-output = analog-output
priority = 7
direction = output
