# Load the AE-9 driver early in boot (systemd-modules-load), so the DSP
# firmware goes in before the rest of startup (network, VMs) gets going.
# Loaded later by udev alone, the DSP's first bring-up failed on about half
# of cold boots (11 of 26; 0 of 150 loaded this way). Installed as
# /usr/lib/modules-load.d/creative-ae9.conf
snd-hda-codec-creative-ae9
